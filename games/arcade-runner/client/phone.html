<div class="section" id="runnerSection">
  <div class="rn-phone-wrap">
    <div class="rn-phone-brand-bar">
      <img src="/images/smallhours-logo.svg" alt="Smallhours" class="rn-brand-logo" /><span>Runner</span>
    </div>
    <div class="rn-phone-header">
      <div class="flex items-center gap-2.5 min-w-0">
        <span id="rnMyAvatar" class="rn-avatar shrink-0"></span>
        <div class="min-w-0">
          <div id="rnMyName" class="font-bold text-white text-sm truncate">Runner</div>
          <div id="rnMyLives" class="text-xs text-rose-300 truncate">❤️❤️❤️ • 💎 0</div>
        </div>
      </div>
      <div class="text-right shrink-0">
        <div id="rnMyScore" class="text-lg font-black text-yellow-400">0</div>
        <div class="flex items-center justify-end gap-1.5">
          <span id="rnLinkPill" class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-mono">WS</span>
        </div>
      </div>
    </div>

    <div id="rnLettersBar" class="rn-letters-bar">
      <span class="rn-letter-chip">H</span>
      <span class="rn-letter-chip">O</span>
      <span class="rn-letter-chip">U</span>
      <span class="rn-letter-chip">R</span>
      <span class="rn-letter-chip">S</span>
    </div>

    <div id="rnSwipePad" class="rn-swipe-pad">
      <div class="rn-parallax-stars" aria-hidden="true"></div>
      <div class="rn-parallax-sun" aria-hidden="true"></div>
      <div class="rn-parallax-mountains" aria-hidden="true"></div>
      <div class="rn-phone-track-bg" aria-hidden="true"></div>
      <div class="rn-pad-copy">
        <div class="rn-phone-orb-stage" aria-hidden="true">
          <div id="rnCssOrbShadow" class="rn-css-orb-shadow"></div>
          <div id="rnCssOrb" class="rn-css-orb"></div>
        </div>
        <div class="font-extrabold text-sm">Use Arrow Keys Below</div>
        <div id="rnPadHint" class="text-xs text-slate-300 mt-0.5">Tap ◀ / ▲ JUMP / ▶ to dodge barriers</div>
      </div>
    </div>

    <div id="rnArrowDeck" class="rn-dpad-row" role="group" aria-label="Runner arrow controls">
      <button id="rnLeftBtn" type="button" class="rn-ctrl-btn rn-arrow-btn" aria-label="Move Left">
        <span class="rn-arrow-glyph" aria-hidden="true">◀</span>
        <span class="rn-arrow-label">LEFT</span>
      </button>
      <button id="rnJumpBtn" type="button" class="rn-ctrl-btn rn-arrow-btn jump" aria-label="Jump">
        <span class="rn-arrow-glyph" aria-hidden="true">▲</span>
        <span class="rn-arrow-label">JUMP</span>
      </button>
      <button id="rnRightBtn" type="button" class="rn-ctrl-btn rn-arrow-btn" aria-label="Move Right">
        <span class="rn-arrow-glyph" aria-hidden="true">▶</span>
        <span class="rn-arrow-label">RIGHT</span>
      </button>
    </div>
  </div>
</div>
